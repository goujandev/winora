name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install packaging tool
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Run configuration checks
        run: dotnet run --project tests/Winora.Checks -c Release
      - name: Test a complete installed update
        shell: pwsh
        run: ./scripts/Test-Updates.ps1 -SelfContained
      - name: Package Winora
        shell: pwsh
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = '0.1.0'
          if ($env:RELEASE_TAG -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          elseif ($env:GITHUB_REF -like 'refs/tags/*') { throw 'Release tags must use vMAJOR.MINOR.PATCH.' }
          ./scripts/Pack.ps1 -Version $version -RepositoryUrl $env:REPOSITORY_URL
      - uses: actions/upload-artifact@v4
        with:
          name: winora-windows-x64
          path: artifacts/releases/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winora-windows-x64
          path: artifacts/releases
      - name: Publish release and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem artifacts/releases -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --repo $env:REPOSITORY --title "Winora $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
